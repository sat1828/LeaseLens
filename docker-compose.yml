version: "3.9"

# ══════════════════════════════════════════════════════════
# LeaseLens — Docker Compose (Local + Production)
# BUG-40 FIX: No default DB password — fails loudly if not set
# BUG-41 FIX: API healthcheck added
# ══════════════════════════════════════════════════════════
#
# Quick start (development):
#   cp backend/.env.example backend/.env  # fill in ANTHROPIC_API_KEY etc
#   export POSTGRES_PASSWORD=$(openssl rand -base64 32)
#   docker-compose up
#
# The API will be at http://localhost:8000
# The frontend will be at http://localhost:3000
# ══════════════════════════════════════════════════════════

services:

  # ── PostgreSQL with pgvector ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # BUG-40 FIX: :? means "fail with error if not set" — no silent default
      POSTGRES_DB: leaselens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set. Run: export POSTGRES_PASSWORD=$(openssl rand -base64 32)}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leaselens"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Override DB URL to use Docker service name, not localhost
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/leaselens"
      DATABASE_URL_SYNC: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/leaselens"
      REDIS_URL: "redis://redis:6379/0"
      APP_ENV: "${APP_ENV:-development}"
    ports:
      - "8000:8000"
    # BUG-41 FIX: healthcheck on API container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    command: >
      sh -c "
        echo '==> Running database migrations...' &&
        alembic upgrade head &&
        echo '==> Starting API server...' &&
        gunicorn app.main:app
          -w 2
          -k uvicorn.workers.UvicornWorker
          --bind 0.0.0.0:8000
          --timeout 120
          --keep-alive 5
          --access-logfile -
          --error-logfile -
          --log-level info
      "

  # ── React frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${API_URL:-http://localhost:8000}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
    driver: local
